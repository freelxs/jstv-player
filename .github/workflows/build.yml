name: Build

on:
  push:
    branches: [main, ci-node-release-750c]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish after successful builds; leave empty for build-only
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate existing release tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$(bash scripts/resolve-release-tag.sh)"
          if [[ -z "$RELEASE_TAG" ]]; then
            exit 0
          fi
          VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)"
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || { echo "Release tag $RELEASE_TAG does not match workflow source version $VERSION." >&2; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" >/dev/null || { echo "Tag $RELEASE_TAG does not exist on origin." >&2; exit 1; }
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_VERSION="$(git show "refs/tags/$RELEASE_TAG:mygo.json" | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')"
          [[ "$RELEASE_TAG" == "v$TAG_VERSION" ]] || { echo "Tag source version $TAG_VERSION does not match $RELEASE_TAG." >&2; exit 1; }
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag != '' && needs.resolve-release.outputs.release_tag || github.sha }}
      - name: Verify checked-out release source
        if: needs.resolve-release.outputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$(git describe --tags --exact-match HEAD)" == "$RELEASE_TAG" ]]
          VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)"
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go vet ./...
      - run: go test ./...
      - name: Frontend tests
        shell: bash
        run: node --test web/*.test.cjs
      - name: Build script fixture tests
        if: runner.os != 'Windows'
        run: bash scripts/build.test.sh
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

  build:
    needs: [test, resolve-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag != '' && needs.resolve-release.outputs.release_tag || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Build macOS slim and bundled Node packages
        if: runner.os == 'macOS'
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          bash scripts/build.sh darwin
          bash scripts/build.sh darwin --with-node
      - name: Build Windows slim and bundled Node packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $nodeVersion = '24.21.0'
          $nodeArchive = "node-v$nodeVersion-win-x64.zip"
          $nodeBase = "https://nodejs.org/dist/v$nodeVersion"
          $sumPath = Join-Path $env:RUNNER_TEMP 'SHASUMS256.txt'
          $archivePath = Join-Path $env:RUNNER_TEMP $nodeArchive
          Invoke-WebRequest "$nodeBase/SHASUMS256.txt" -OutFile $sumPath
          Invoke-WebRequest "$nodeBase/$nodeArchive" -OutFile $archivePath
          $expected = ((Get-Content $sumPath | Where-Object { $_ -match "\s+$([regex]::Escape($nodeArchive))$" } | Select-Object -First 1) -split '\s+')[0]
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected.ToLowerInvariant()) { throw 'Official Node archive SHA-256 verification failed' }
          $extract = Join-Path $env:RUNNER_TEMP 'node-extract'
          Expand-Archive $archivePath $extract -Force
          $nodeSource = Join-Path $extract "node-v$nodeVersion-win-x64"
          $resourceRoot = Join-Path $PWD 'resources/windows-amd64'
          $out = Join-Path $PWD 'out'
          $ownsResourceRoot = $false
          New-Item $out -ItemType Directory -Force | Out-Null
          try {
            go tool mygo build -platform windows/amd64
            if ($LASTEXITCODE -ne 0) { throw "Slim Windows build failed with exit code $LASTEXITCODE" }
            $dist = Join-Path $PWD 'dist/windows-amd64'
            $slim = Join-Path $out "JSTV-Player-$version-windows-amd64.zip"
            Compress-Archive -Path (Join-Path $dist 'JSTV Player.exe'), (Join-Path $dist 'icon.png') -DestinationPath $slim -Force
            $setup = Get-ChildItem $dist -Filter '*etup*.exe' | Select-Object -First 1
            if ($setup) { Copy-Item $setup.FullName (Join-Path $out "JSTV-Player-$version-windows-amd64-setup.exe") }
            $check = Join-Path $env:RUNNER_TEMP 'slim-check'
            Expand-Archive $slim $check -Force
            if (Test-Path (Join-Path $check 'node')) { throw 'Slim Windows package unexpectedly contains Node' }
            if (Test-Path $resourceRoot) { throw 'Refusing to overwrite pre-existing Windows resources' }
            New-Item $resourceRoot -ItemType Directory -ErrorAction Stop | Out-Null
            $ownsResourceRoot = $true
            New-Item (Join-Path $resourceRoot 'node/bin') -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $nodeSource 'node.exe') (Join-Path $resourceRoot 'node/bin/node.exe')
            Copy-Item (Join-Path $nodeSource 'LICENSE') (Join-Path $resourceRoot 'node/LICENSE')
            $nodeExe = Join-Path $resourceRoot 'node/bin/node.exe'
            $nodeOutput = (& $nodeExe --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Bundled Node failed to run with exit code $LASTEXITCODE" }
            if ($nodeOutput -ne "v$nodeVersion") { throw "Bundled Node returned '$nodeOutput', expected 'v$nodeVersion'" }
            Remove-Item (Join-Path $PWD 'dist/windows-amd64') -Recurse -Force
            go tool mygo build -platform windows/amd64
            if ($LASTEXITCODE -ne 0) { throw "Bundled Node Windows build failed with exit code $LASTEXITCODE" }
            $dist = Join-Path $PWD 'dist/windows-amd64'
            $fat = Join-Path $out "JSTV-Player-$version-windows-amd64-with-node.zip"
            Compress-Archive -Path (Join-Path $dist 'JSTV Player.exe'), (Join-Path $dist 'icon.png'), (Join-Path $dist 'node') -DestinationPath $fat -Force
            $fatCheck = Join-Path $env:RUNNER_TEMP 'fat-check'
            Expand-Archive $fat $fatCheck -Force
            if (-not (Test-Path (Join-Path $fatCheck 'node/bin/node.exe')) -or -not (Test-Path (Join-Path $fatCheck 'node/LICENSE'))) { throw 'Bundled Node files missing from Windows package' }
            if ((Get-Item (Join-Path $fatCheck 'node/bin/node.exe')).Length -lt 1000000) { throw 'Bundled Node executable is unexpectedly small' }
            $setup = Get-ChildItem $dist -Filter '*etup*.exe' | Select-Object -First 1
            if ($setup) { Copy-Item $setup.FullName (Join-Path $out "JSTV-Player-$version-windows-amd64-with-node-setup.exe") }
          }
          finally {
            if ($ownsResourceRoot -and (Test-Path $resourceRoot)) { Remove-Item $resourceRoot -Recurse -Force }
          }
      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)
          go tool mygo build -platform linux/amd64
          mkdir -p out
          cd dist/linux-amd64
          cp *.deb "../../out/jstv-player_${V}_amd64.deb"
          cp *.tar.gz "../../out/jstv-player-$V-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: jstv-player-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: needs.resolve-release.outputs.release_tag != ''
    needs: [build, resolve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG" release-assets/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
