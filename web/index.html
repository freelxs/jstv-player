<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSTV Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>JSTV Player</span></div>

  <div class="switcher">
    <div class="label">订阅</div>
    <button id="subBtn" class="sub-btn" aria-haspopup="menu" aria-expanded="false">
      <span class="sub-dot"></span><span id="subName" class="sub-name">未添加订阅</span><span class="chev" aria-hidden="true"></span>
    </button>
    <div id="subMenu" class="menu" role="menu" hidden></div>
  </div>

  <div class="label row-between"><span>站点</span><span id="status" class="count"></span></div>
  <nav id="sites" class="sites"></nav>

  <div class="sidebar-foot">
    <button id="btnReload" class="ghost icon-text" title="重新加载当前订阅"><i class="i i-reload"></i>重新加载</button>
    <button id="btnSettings" class="ghost icon-text" title="设置"><i class="i i-gear"></i>设置</button>
  </div>
</aside>

<main>
  <header class="topbar">
    <button id="back" class="icon-btn" title="返回" hidden><i class="i i-back"></i></button>
    <label class="search">
      <i class="i i-search"></i>
      <input id="q" placeholder="搜索全部站点" autocomplete="off" spellcheck="false" />
      <kbd>↵</kbd>
    </label>
    <label class="toggle" title="只在当前站点搜索"><input type="checkbox" id="onlySite"><span class="track"></span><span>仅当前站点</span></label>
  </header>
  <nav id="classes" class="chips"></nav>
  <section id="filters" class="filters" aria-label="分类筛选" hidden></section>
  <section id="view" class="view"></section>
</main>

<dialog id="settings" class="sheet">
  <div class="sheet-head">
    <h3>设置</h3>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="subs">订阅</button>
      <button class="tab" data-tab="play">播放</button>
      <button class="tab" data-tab="logs">日志</button>
    </div>
    <button class="icon-btn" id="sClose" title="关闭"><i class="i i-x"></i></button>
  </div>

  <div class="pane" data-pane="subs">
    <p class="hint">每个订阅是一个插件地址（<code>index.js</code> 或 <code>index.js.md5</code>）。可以添加多个，在左上角随时切换。</p>
    <ul id="subList" class="sub-list"></ul>
    <form id="subForm" class="sub-form">
      <input id="subFormId" type="hidden">
      <input id="subFormName" placeholder="名称（可选）" maxlength="40">
      <input id="subFormURL" placeholder="https://example.com/path/index.js.md5" required>
      <button class="primary" id="subFormBtn">添加</button>
      <button type="button" class="ghost" id="subFormCancel" hidden>取消</button>
    </form>
    <p class="hint small">插件由你自行提供并负责，本应用不内置任何插件或地址。</p>
  </div>

  <form class="pane" data-pane="play" id="prefs" hidden>
    <label class="field"><span>播放器</span>
      <select id="sPlayer">
        <option value="builtin">内置播放器（HLS / MP4）</option>
        <option value="potplayer" data-os="win">PotPlayer（Windows）</option>
        <option value="iina" data-os="mac">IINA（macOS）</option>
        <option value="mpv">mpv</option>
        <option value="system">系统默认</option>
      </select></label>
    <label class="field"><span>Node.js 路径 <em>留空自动查找</em></span>
      <input id="sNode" placeholder="/usr/local/bin/node" /></label>
    <label class="field"><span>播放桥模板 <em>可选，留空关闭；{vid}、{res} 会被替换</em></span>
      <input id="sBridge" placeholder="https://example.com/media/{vid}/{res}.mp4" /></label>
    <label class="check"><input type="checkbox" id="sContinuous"> 连播：播放某一集后自动接着播放同一线路的后续剧集</label>
    <label class="check"><input type="checkbox" id="sStrict"> md5 不一致时拒绝加载</label>
    <label class="check"><input type="checkbox" id="sAllowLan"> 允许局域网访问：将插件 API 绑定到所有网络接口，局域网设备可调用插件并访问其上游代理。仅在可信网络开启；启动失败会停止旧服务。</label>
    <label class="check"><input type="checkbox" id="sAllowLanMedia"> 允许播放插件返回的局域网媒体地址（默认关闭）</label>
    <label class="check"><input type="checkbox" id="sInheritNodeEnv"> 高级兼容模式：将完整环境变量传给 Node，以兼容代理、自定义证书等环境（可能包含代理凭据或其他秘密）</label>
    <div class="field"><button type="button" class="btn" id="probeNodePermissions">检测 Node 权限标志</button><p id="nodePermissionResult" class="hint small">检测仅查看当前 Node 的帮助信息，不启用权限限制，也不是安全沙箱。</p></div>
    <div class="actions"><button class="primary" id="sSave">保存</button></div>
  </form>

  <div class="pane" data-pane="logs" hidden>
    <pre id="logs" class="logs"></pre>
  </div>
</dialog>

<dialog id="sourceTrust" class="sheet trust-sheet">
  <div class="sheet-head"><h3 id="trustTitle">确认插件版本</h3></div>
  <p id="trustMessage" class="hint"></p>
  <p class="hint small">SHA-256 仅用于本机识别内容变化（TOFU），不证明发布者身份。批准后才会启动此版本。</p>
  <div class="actions"><button class="ghost" id="trustReject">拒绝并保持源停止</button><button class="primary" id="trustApprove">批准此版本并运行</button></div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script src="request-token.js"></script>
<script src="youtube-help.js"></script>
<script src="app.js"></script>
</body>
</html>
